name: Bot XAU/USD

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install requests tzdata

      - name: Esegui il bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          MARKETAUX_KEY: ${{ secrets.MARKETAUX_KEY }}
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: python bot_xauusd_telegram_cloud.py

      - name: Salva lo stato aggiornato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stato_bot.json

          if git diff --staged --quiet; then
            echo "Nessuna modifica allo stato, niente da salvare."
            exit 0
          fi

          git commit -m "Aggiorna stato bot [skip ci]"

          for tentativo in 1 2 3 4 5; do
            if git push; then
              echo "Stato salvato con successo."
              exit 0
            fi
            echo "Push rifiutato (probabile esecuzione sovrapposta), tentativo $tentativo/5: scarico gli aggiornamenti e riprovo..."
            git pull --rebase origin main
            sleep 3
          done

          echo "Attenzione: non sono riuscito a salvare lo stato dopo 5 tentativi."
          echo "Il bot ha comunque svolto il suo lavoro in questa esecuzione (messaggi già inviati sopra)."
          exit 0
