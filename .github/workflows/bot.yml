name: Bot XAU/USD

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: pip install requests
      - name: Debug - lunghezza dei secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          MARKETAUX_KEY: ${{ secrets.MARKETAUX_KEY }}
        run: |
          echo "Lunghezza TELEGRAM_BOT_TOKEN: ${#TELEGRAM_BOT_TOKEN}"
          echo "Lunghezza TELEGRAM_CHAT_ID: ${#TELEGRAM_CHAT_ID}"
          echo "Lunghezza GOLDAPI_KEY: ${#GOLDAPI_KEY}"
          echo "Lunghezza MARKETAUX_KEY: ${#MARKETAUX_KEY}"
      - name: Esegui il bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          MARKETAUX_KEY: ${{ secrets.MARKETAUX_KEY }}
        run: python bot_xauusd_telegram_cloud.py

      - name: Salva lo stato aggiornato nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stato_bot.json
          git diff --staged --quiet || git commit -m "Aggiorna stato bot [skip ci]"
          git push
